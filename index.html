<!DOCTYPE html>

    <style>

            background-color: #f6f8fa;
            color: #24292e;
            text-align: center;
            padding: 40px 20px;

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        a.btn {
            display: block;
            background-color: #0366d6;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        a.btn:hover {
            background-color: #0056b3;
        }
        a.btn.secondary {
